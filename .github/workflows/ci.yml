name: Compiler compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure, build, and test
        shell: pwsh
        env:
          BUILD_PRESET: ${{ matrix.preset }}
        run: |
          . ./scripts/Enter-Toolchain.ps1
          cmake --version
          ninja --version
          cmake --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Portable build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure, build, and test portable scaffold
        run: |
          cmake --version
          ninja --version
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug

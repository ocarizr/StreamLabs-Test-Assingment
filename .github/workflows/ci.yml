name: Build and test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure, build, and test
        shell: pwsh
        env:
          BUILD_PRESET: ${{ matrix.preset }}
        run: |
          . ./scripts/Enter-Toolchain.ps1
          cmake --version
          ninja --version
          cmake --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset $env:BUILD_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and test standalone runtimes
        if: matrix.preset == 'windows-release'
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          python scripts/release.py package --build build/windows-release --tag V0.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release.py smoke --tag V0.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Portable build and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed formatting tool
        run: |
          python3 -m venv .tools/format-venv
          .tools/format-venv/bin/python -m pip install clang-format==19.1.5
      - name: Check formatting
        run: python3 scripts/check_format.py --clang-format .tools/format-venv/bin/clang-format
      - name: Configure, build, and test portable scaffold
        run: |
          cmake --version
          ninja --version
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug

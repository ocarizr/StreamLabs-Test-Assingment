name: Static analysis and sanitizers
on:
  pull_request:
  push:
    branches: [master]
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3

permissions:
  contents: read
jobs:
  clang-tidy:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure and build with the matching Windows Clang toolchain
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          clang-tidy --version
          cmake --preset windows-clang -DPIPEFORGE_BUILD_BENCHMARKS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-clang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze maintained code with warnings as errors
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          python scripts/check_tidy.py --build build/windows-clang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify defect detection probes
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          python scripts/check_analysis_probes.py --clang-tidy clang-tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve complete analyzer output including excluded header totals
        if: ${{ always() && hashFiles('build/windows-clang/clang-tidy.log') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clang-tidy-log
          path: build/windows-clang/clang-tidy.log
          retention-days: 14
          if-no-files-found: error
  windows-asan:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: halt_on_error=1:alloc_dealloc_mismatch=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the verified LLVM sanitizer toolchain
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.3-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe' -OutFile $installer
          $expected = '72ca54c3b7940615776d8994c0b918a1d8c4981bdcf13b439eaa86a1bd477001'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM installer SHA256 mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'pipeforge-llvm-22'
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "LLVM installation failed: $($installation.ExitCode)" }
          "PIPEFORGE_LLVM_ROOT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build the complete clang-cl dependency graph with AddressSanitizer
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          $env:PATH = "$env:PIPEFORGE_LLVM_ROOT/bin;$env:PATH"
          $resource = clang-cl -print-resource-dir
          $env:PATH = "$resource/lib/windows;$env:PATH"
          cmake --preset windows-asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test client futures, native pipes and process acceptance
        shell: pwsh
        run: |
          . ./scripts/Enter-Toolchain.ps1
          $env:PATH = "$env:PIPEFORGE_LLVM_ROOT/bin;$env:PATH"
          $resource = clang-cl -print-resource-dir
          $env:PATH = "$resource/lib/windows;$env:PATH"
          ctest --preset windows-asan -L 'unit|integration|end-to-end'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native sanitizer and CTest diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-asan-tests
          path: build/windows-asan/Testing/Temporary/
          retention-days: 14
          if-no-files-found: warn
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test maintained code under ASan, UBSan, and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang++ --version
          cmake --preset linux-debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DPIPEFORGE_SANITIZERS=ON
          cmake --build --preset linux-debug
          ctest --preset linux-debug -L 'unit|integration'
